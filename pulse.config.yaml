# pulse.config.yaml — generated by `pulse init`
# Docs: https://docs.waydock.ai/pulse

node: MacBook-Pro          # unique name for this machine

heartbeat:
  url: https://ingest.waydock.ai/api/pulse/heartbeat
  # key is loaded from ~/.pulse/credentials.json after `pulse login`
  interval: 30           # seconds between heartbeats

defaults:
  retries: 3             # restart attempts before giving up
  confirm: 2             # consecutive failures before marking down

agents:
  - name: localhost_3000
    checks:
      - http: http://localhost:3000
    # alert-only: Pulse reports it down but runs no restart command
